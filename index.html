<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>落とし物管理アプリ</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div class="app">
            <section class="register-section">
                <h1>落とし物管理アプリ</h1>

                <form id="item-form">
                    <div class="input-group">
                        <input
                            id="item-input"
                            class="item-input"
                            type="text"
                            name="item"
                            placeholder="落し物の名前"
                            required
                        />

                        <input
                            id="pickupplace-input"
                            class="pickupplace-input"
                            type="text"
                            name="pickupplace"
                            placeholder="拾得場所"
                            required
                        />

                        <input
                            id="date-input"
                            class="date-input"
                            type="date"
                            name="date"
                            required
                        />

                        <input
                            id="nowplace-input"
                            class="nowplace-input"
                            type="text"
                            name="nowplace"
                            placeholder="保管場所"
                            required
                        />

                        <button id="add-button" class="add-button" type="submit">追加</button>
                    </div>
                </form>
            </section>

            <section class="list-section">
                <h2>落し物一覧</h2>

                <table class="item-table">
                    <thead>
                        <tr>
                            <th scope="col">番号</th>
                            <th scope="col">落し物の名前</th>
                            <th scope="col">拾得場所</th>
                            <th scope="col">日付</th>
                            <th scope="col">保管場所</th>
                        </tr>
                    </thead>
                    <tbody id="item-list" aria-live="polite"></tbody>
                </table>
            </section>
        </div>

        <script src="./app.js" defer></script>
    </body>
</html>
