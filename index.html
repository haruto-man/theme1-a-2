<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>落とし物管理アプリ</title>
        <link rel="stylesheet" href="./style.css" />
    </head>
    <body>
        <div class="app">
            <section class="register-section">
                <h1>落とし物管理アプリ</h1>

                <form id="item-form">
                    <div class="input-group">
                        <input
                            id="item-input"
                            class="item-input"
                            type="text"
                            name="item"
                            placeholder="落し物の名前"
                            required
                        />

                        <input
                            id="pickupplace-input"
                            class="pickupplace-input"
                            type="text"
                            name="pickupplace"
                            placeholder="拾得場所"
                            required
                        />

                        <input
                            id="date-input"
                            class="date-input"
                            type="date"
                            name="date"
                            required
                        />

                        <input
                            id="nowplace-input"
                            class="nowplace-input"
                            type="text"
                            name="nowplace"
                            placeholder="保管場所"
                            required
                        />

                        <button id="add-button" class="add-button" type="submit">追加</button>
                    </div>
                </form>
            </section>

            <section class="list-section">
                <h2>落し物一覧</h2>

                <table class="item-table">
                    <thead>
                        <tr>
                            <th scope="col" data-column="item">
                                <span class="th-label-wrap">
                                    <span class="th-label">落し物の名前</span>
                                    <button
                                        type="button"
                                        class="filter-button"
                                        aria-label="名前で絞り込み"
                                        data-target="item"
                                    >
                                        ▼
                                    </button>
                                </span>

                                <div class="filter-popover" data-column="item">
                                    <input
                                        type="text"
                                        class="filter-input"
                                        data-column="item"
                                        placeholder="名前で検索"
                                    />
                                    <button type="button" class="filter-clear" data-column="item">クリア</button>
                                </div>
                            </th>

                            <th scope="col" data-column="pickupplace">
                                <span class="th-label-wrap">
                                    <span class="th-label">拾得場所</span>
                                    <button
                                        type="button"
                                        class="filter-button"
                                        aria-label="拾得場所で絞り込み"
                                        data-target="pickupplace"
                                    >
                                        ▼
                                    </button>
                                </span>

                                <div class="filter-popover" data-column="pickupplace">
                                    <input
                                        type="text"
                                        class="filter-input"
                                        data-column="pickupplace"
                                        placeholder="拾得場所で検索"
                                    />
                                    <button type="button" class="filter-clear" data-column="pickupplace">クリア</button>
                                </div>
                            </th>

                            <th scope="col" data-column="date">
                                <span class="th-label-wrap">
                                    <span class="th-label">日付</span>
                                    <button
                                        type="button"
                                        class="filter-button"
                                        aria-label="日付で絞り込み"
                                        data-target="date"
                                    >
                                        ▼
                                    </button>
                                </span>

                                <div class="filter-popover" data-column="date">
                                    <input
                                        type="date"
                                        class="filter-input"
                                        data-column="date"
                                        placeholder="日付で検索"
                                    />
                                    <button type="button" class="filter-clear" data-column="date">クリア</button>
                                </div>
                            </th>

                            <th scope="col" data-column="nowplace">
                                <span class="th-label-wrap">
                                    <span class="th-label">保管場所</span>
                                    <button
                                        type="button"
                                        class="filter-button"
                                        aria-label="保管場所で絞り込み"
                                        data-target="nowplace"
                                    >
                                        ▼
                                    </button>
                                </span>

                                <div class="filter-popover" data-column="nowplace">
                                    <input
                                        type="text"
                                        class="filter-input"
                                        data-column="nowplace"
                                        placeholder="保管場所で検索"
                                    />
                                    <button type="button" class="filter-clear" data-column="nowplace">クリア</button>
                                </div>
                            </th>

                            <th scope="col"></th>
                        </tr>
                    </thead>
                    <tbody id="item-list" aria-live="polite"></tbody>
                </table>
            </section>
        </div>

        <script src="./app.js" defer></script>
    </body>
</html>
